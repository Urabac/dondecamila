<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dondecamila · Fast Food en PSan félix</title>
<meta name="description" content="Hamburguesas, perritos calientes y combos con envíos a San félix.">
<link rel="icon" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <a class="logo" href="#" aria-label="Dondecamila"><img src="images/logo.png" alt="Dondecamila" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'CAMILA',className:'logo-fb'}))"></a>
  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="search" type="search" placeholder="Busca hamburguesas, perritos, combos…" autocomplete="off">
  </label>
  <a class="contact" id="contactLink" target="_blank" rel="noopener">Contacto ↗</a>
  <button class="order-btn" id="openCart" aria-label="Abrir pedido">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
    Pedido <span class="badge" id="cartCount">0</span>
  </button>
</header>

<section class="hero">
  <p class="eyebrow"><i></i>Hecho para tu antojo<i></i></p>
  <h1>DONDECAMILA</h1>
  <p class="sub">Fast Food de Calidad <b>·</b> Envíos a todo San félix</p>
  <svg class="utensils" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m16 2-2.3 2.3a3 3 0 0 0 0 4.2l1.8 1.8a3 3 0 0 0 4.2 0L22 8M15 15 3.3 3.3a4.2 4.2 0 0 0 0 6l7.3 7.3c.7.7 2 .7 2.8 0L15 15Zm0 0 7 7M2.1 21.8l6.4-6.3"/></svg>
</section>

<main>
  <nav class="chips" id="chips"></nav>
  <div class="section-head">
    <div><small>EL SABOR DE LA CIUDAD</small><h2>Elige tu próximo antojo.</h2></div>
    <span id="count"></span>
  </div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>No encontramos productos con esa búsqueda.</p>
</main>

<a class="wa-float" id="waFloat" target="_blank" rel="noopener" aria-label="WhatsApp">
  <svg width="28" height="28" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.2 14.2c-.2.6-1.300 1.200-1.800 1.200-.5.1-1 .2-3.300-.7-2.800-1.100-4.600-3.900-4.700-4.100-.1-.2-1.100-1.500-1.100-2.800s.7-2 1-2.300c.2-.3.500-.3.700-.3h.5c.2 0 .4 0 .6.500l.9 2.100c.1.2.1.400 0 .6l-.4.600-.4.400c-.1.200-.3.400-.1.700.2.300.8 1.300 1.700 2.100 1.100 1 2.100 1.300 2.400 1.400.3.100.5.100.7-.1l1-1.200c.2-.3.400-.2.700-.1l2 1c.3.100.5.200.6.300.1.200.1.700-.1 1.300Z"/></svg>
</a>

<div class="overlay" id="overlay" hidden></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head"><h3>Tu pedido</h3><button id="closeCart" aria-label="Cerrar">✕</button></div>
  <div class="drawer-body" id="cartItems"></div>
  <form class="drawer-foot" id="checkout">
    <div class="total"><span>Total</span><strong id="total">$0.00</strong></div>
    <input name="name" placeholder="Tu nombre" required>
    <input name="address" placeholder="Dirección de entrega" required>
    <textarea name="notes" rows="2" placeholder="Notas (sin cebolla, extra salsa…)"></textarea>
    <button class="send" type="submit">Enviar pedido por WhatsApp</button>
    <button class="clear" type="button" id="clearCart">Vaciar pedido</button>
  </form>
</aside>
<div class="toast" id="toast"></div>

<script src="products.js"></script>
<script src="app.js"></script>
</body>
</html>
